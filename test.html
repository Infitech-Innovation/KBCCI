<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KBCCI Member Globe</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      min-height: 100vh;
      overflow: hidden;
      background: #e7e7e7;
      display: grid;
      place-items: center;
      font-family: Inter, Arial, sans-serif;
      color: #111827;
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 34% 24%, rgba(255, 255, 255, 0.96), transparent 27%),
        linear-gradient(90deg, #f6f6f6 0%, #dedede 54%, #cfcfcf 100%);
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 8;
    }

    .member-card {
      position: absolute;
      left: 0;
      top: 0;
      display: grid;
      place-items: center;
      width: 92px;
      height: 92px;
      padding: 2px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.93);
      box-shadow: 0 18px 45px rgba(31, 41, 55, 0.15);
      backdrop-filter: blur(12px);
      transform: translate3d(-50%, -50%, 0);
      transform-origin: 50% 50%;
      will-change: transform, opacity;
      pointer-events: none;
      z-index: 18;
    }

    .member-card__logo {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: #ffffff;
      border: 1px solid rgba(17, 24, 39, 0.08);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.4);
      overflow: hidden;
    }

    .member-card__logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .scene-label {
      position: absolute;
      left: 44px;
      bottom: 32px;
      color: rgba(17, 24, 39, 0.58);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    @media (max-width: 720px) {
      .member-card {
        width: 76px;
        height: 76px;
        border-radius: 13px;
        padding: 10px;
      }

      .member-card__logo {
        border-radius: 11px;
      }

      .scene-label {
        left: 22px;
        bottom: 20px;
        letter-spacing: 2px;
      }
    }
  </style>
</head>

<body>
  <main class="scene">
    <canvas id="globe"></canvas>

    <article class="member-card" aria-label="KBCCI member">
      <div class="member-card__logo"><img alt="" /></div>
    </article>

    <article class="member-card" aria-label="KBCCI member">
      <div class="member-card__logo"><img alt="" /></div>
    </article>

    <div class="scene-label">Global Member Network</div>
  </main>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    const canvas = document.getElementById("globe");
    const cards = [...document.querySelectorAll(".member-card")];

    const members = [
      ["Bio Invest", "https://fx.iguanyalabs.com/images/kbcci/logo/bio-invest.png"],
      ["Belgian Scrap Terminal", "https://fx.iguanyalabs.com/images/kbcci/logo/belgian-scrap-terminal.png"],
      ["Bosaq", "https://fx.iguanyalabs.com/images/kbcci/logo/bosaq.png"],
      ["CBL-ACP", "https://fx.iguanyalabs.com/images/kbcci/logo/CBL-ACP.png"],
      ["Circular It Group", "https://fx.iguanyalabs.com/images/kbcci/logo/circular-it-group.png"],
      ["Deme", "https://fx.iguanyalabs.com/images/kbcci/logo/deme.png"],
      ["Ecosteryl", "https://fx.iguanyalabs.com/images/kbcci/logo/ecosteryl.png"],
      ["Flynth", "https://fx.iguanyalabs.com/images/kbcci/logo/flynth.png"],
      ["Ghelamco", "https://fx.iguanyalabs.com/images/kbcci/logo/ghelamco.png"],
      ["Greenyard", "https://fx.iguanyalabs.com/images/kbcci/logo/greenyard.png"],
      ["Jules Destooper", "https://fx.iguanyalabs.com/images/kbcci/logo/jules-destooper.png"],
      ["KENINVEST", "https://fx.iguanyalabs.com/images/kbcci/logo/KENINVEST.png"],
      ["KEPSA", "https://fx.iguanyalabs.com/images/kbcci/logo/KEPSA.png"],
      ["Lufthansa Group", "https://fx.iguanyalabs.com/images/kbcci/logo/lufthansa-group.png"],
      ["Natural State", "https://fx.iguanyalabs.com/images/kbcci/logo/natural-state.png"],
      ["Odoo", "https://fx.iguanyalabs.com/images/kbcci/logo/odoo.png"],
      ["Protex Healthcare", "https://fx.iguanyalabs.com/images/kbcci/logo/protex-healthcare.png"],
      ["Puratos", "https://fx.iguanyalabs.com/images/kbcci/logo/puratos.png"],
      ["Sirona", "https://fx.iguanyalabs.com/images/kbcci/logo/sirona.png"],
      ["Televic", "https://fx.iguanyalabs.com/images/kbcci/logo/televic.png"],
      ["Texaf", "https://fx.iguanyalabs.com/images/kbcci/logo/texaf.png"],
      ["Vliruos", "https://fx.iguanyalabs.com/images/kbcci/logo/vliruos.png"],
      ["Vyncke", "https://fx.iguanyalabs.com/images/kbcci/logo/vyncke.png"],
      ["Zetes", "https://fx.iguanyalabs.com/images/kbcci/logo/zetes.png"]
    ];

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.z = 4.25;

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const globeGroup = new THREE.Group();
    const initialGlobeRotationY = -0.42;
    const globeSpinSpeed = 0.16;
    globeGroup.position.x = 0.46;
    globeGroup.rotation.set(-0.08, initialGlobeRotationY, 0.03);
    scene.add(globeGroup);

    const radius = 1.72;

    const globe = new THREE.Mesh(
      new THREE.SphereGeometry(radius, 96, 96),
      new THREE.MeshStandardMaterial({
        color: 0xf3f4f1,
        roughness: 0.48,
        metalness: 0.08
      })
    );
    globeGroup.add(globe);

    const continents = [
      [[-168, 71], [-145, 72], [-124, 61], [-115, 50], [-100, 50], [-87, 43], [-75, 47], [-59, 49], [-53, 57], [-67, 69], [-96, 75], [-125, 72], [-154, 62]],
      [[-132, 55], [-123, 40], [-115, 30], [-103, 22], [-96, 17], [-88, 20], [-82, 10], [-78, 8], [-81, 24], [-91, 29], [-100, 31], [-108, 37], [-118, 46]],
      [[-82, 12], [-73, 7], [-67, -8], [-61, -21], [-66, -36], [-72, -53], [-59, -55], [-48, -38], [-38, -21], [-44, -7], [-51, 3], [-62, 8]],
      [[-11, 36], [-5, 50], [9, 58], [23, 60], [34, 49], [31, 40], [15, 35], [2, 36]],
      [[-18, 31], [-7, 36], [11, 34], [30, 31], [42, 12], [51, -3], [44, -17], [34, -35], [18, -35], [7, -22], [-5, -8], [-16, 10]],
      [[31, 70], [60, 67], [88, 72], [121, 62], [151, 58], [169, 50], [151, 37], [135, 34], [122, 19], [105, 8], [93, 20], [78, 8], [68, 23], [52, 24], [43, 36], [32, 42]],
      [[73, 32], [89, 28], [99, 20], [105, 10], [103, 1], [95, 6], [82, 15], [75, 23]],
      [[112, -10], [154, -12], [153, -30], [140, -42], [121, -36], [113, -24]],
      [[-73, 80], [-20, 83], [-15, 72], [-42, 61], [-63, 66]],
      [[-180, -70], [-120, -66], [-60, -72], [20, -68], [100, -73], [180, -67], [180, -84], [-180, -84]],
      [[46, -12], [51, -16], [50, -25], [46, -25], [43, -18]],
      [[-10, 58], [-4, 56], [-2, 51], [-6, 50], [-10, 53]],
      [[138, 45], [145, 42], [142, 35], [136, 33], [130, 31], [132, 38]],
      [[166, -35], [178, -38], [175, -45], [166, -47], [162, -41]]
    ];

    function lonLatToVector(lon, lat, surfaceRadius) {
      const latRad = THREE.MathUtils.degToRad(lat);
      const lonRad = THREE.MathUtils.degToRad(lon);
      return new THREE.Vector3(
        surfaceRadius * Math.cos(latRad) * Math.cos(lonRad),
        surfaceRadius * Math.sin(latRad),
        -surfaceRadius * Math.cos(latRad) * Math.sin(lonRad)
      );
    }

    function pointInPolygon(lon, lat, polygon) {
      let inside = false;
      for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        const xi = polygon[i][0];
        const yi = polygon[i][1];
        const xj = polygon[j][0];
        const yj = polygon[j][1];
        const intersects = yi > lat !== yj > lat && lon < ((xj - xi) * (lat - yi)) / (yj - yi) + xi;
        if (intersects) inside = !inside;
      }
      return inside;
    }

    function isLand(lat, lon) {
      return continents.some(polygon => pointInPolygon(lon, lat, polygon));
    }

    const coastlineMaterial = new THREE.LineBasicMaterial({
      color: 0x168f86,
      transparent: true,
      opacity: 0.78,
      depthWrite: false
    });

    continents.forEach(polygon => {
      const coastlinePoints = polygon.map(([lon, lat]) => lonLatToVector(lon, lat, radius * 1.018));
      const coastlineGeometry = new THREE.BufferGeometry().setFromPoints(coastlinePoints);
      globeGroup.add(new THREE.LineLoop(coastlineGeometry, coastlineMaterial));
    });

    const dotPositions = [];
    for (let lat = -82; lat <= 82; lat += 1.65) {
      const rowOffset = Math.abs(Math.round(lat)) % 2 ? 0.82 : 0;
      for (let lon = -180 + rowOffset; lon <= 180; lon += 1.65) {
        if (!isLand(lat, lon)) continue;

        const point = lonLatToVector(lon, lat, radius * 1.012);
        dotPositions.push(point.x, point.y, point.z);
      }
    }

    const landGeometry = new THREE.BufferGeometry();
    landGeometry.setAttribute("position", new THREE.Float32BufferAttribute(dotPositions, 3));

    const landDots = new THREE.Points(
      landGeometry,
      new THREE.PointsMaterial({
        color: 0x29b9aa,
        size: 0.018,
        transparent: true,
        opacity: 0.96,
        depthWrite: false
      })
    );
    globeGroup.add(landDots);

    const softShadow = new THREE.Mesh(
      new THREE.SphereGeometry(radius * 1.01, 96, 96),
      new THREE.MeshBasicMaterial({
        color: 0x111111,
        transparent: true,
        opacity: 0.12,
        side: THREE.BackSide
      })
    );
    globeGroup.add(softShadow);

    scene.add(new THREE.AmbientLight(0xffffff, 1.4));

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.25);
    keyLight.position.set(-3, 2.8, 4.2);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xb9d8d4, 1.15);
    fillLight.position.set(3.6, -0.8, 2.5);
    scene.add(fillLight);

    const clock = new THREE.Clock();
    const cardSlots = cards.slice(0, 2).map((el, index) => ({ el, index, memberIndex: -1 }));
    const projectedCardPosition = new THREE.Vector3();

    function smoothstep(edge0, edge1, value) {
      const x = THREE.MathUtils.clamp((value - edge0) / (edge1 - edge0), 0, 1);
      return x * x * (3 - 2 * x);
    }

    function setCardMember(slot, memberIndex) {
      if (slot.memberIndex === memberIndex) return;

      const [name, logo] = members[memberIndex];
      const image = slot.el.querySelector("img");
      slot.el.setAttribute("aria-label", `${name} KBCCI member`);
      image.src = logo;
      image.alt = `${name} logo`;
      slot.memberIndex = memberIndex;
    }

    function updateCards(time) {
      const speed = 0.085;

      cardSlots.forEach(slot => {
        const raw = time * speed + slot.index * 0.5;
        const progress = raw % 1;
        const lap = Math.floor(raw);
        const memberIndex = (lap * cardSlots.length + slot.index) % members.length;
        setCardMember(slot, memberIndex);

        const orbitAngle = THREE.MathUtils.lerp(-2.28, -7.16, progress);
        const orbitRadius = radius * 1.3;
        const localPoint = new THREE.Vector3(
          Math.cos(orbitAngle) * orbitRadius,
          THREE.MathUtils.lerp(-0.86, 0.86, progress) * radius,
          Math.sin(orbitAngle) * orbitRadius
        );

        localPoint.applyMatrix4(globeGroup.matrixWorld);
        projectedCardPosition.copy(localPoint).project(camera);

        const x = (projectedCardPosition.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-projectedCardPosition.y * 0.5 + 0.5) * window.innerHeight;
        const fadeIn = smoothstep(0.04, 0.28, progress);
        const fadeOut = 1 - smoothstep(0.72, 0.96, progress);
        const visibleArc = Math.sin(progress * Math.PI);
        const backFade = THREE.MathUtils.lerp(0.44, 1, visibleArc);
        const opacity = fadeIn * fadeOut * backFade;
        const scale = THREE.MathUtils.lerp(0.7, 1.06, visibleArc);
        slot.el.style.zIndex = String(18 + Math.round(visibleArc * 10));
        slot.el.style.opacity = opacity.toFixed(3);
        slot.el.style.transform = `translate3d(${x}px, ${y}px, 0) translate(-50%, -50%) scale(${scale})`;
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      globeGroup.rotation.y = initialGlobeRotationY + elapsed * globeSpinSpeed;
      globeGroup.updateMatrixWorld(true);
      updateCards(elapsed);

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      globeGroup.updateMatrixWorld(true);
      updateCards(clock.getElapsedTime());
    });
  </script>
</body>
</html>
